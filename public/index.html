<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="only light">
<title>Juancho's BBQ · Procedimientos de equipo</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Staatliches&family=Bebas+Neue&family=Roboto:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap');
html{background:#FFFDE8;color-scheme:only light}
:root{color-scheme:only light;
  --paper:#FFFDE8; --ink:#0F0F0F; --steel:#6B6357; --line:#E9E3C8;
  --red:#B61829; --sauce:#68121F; --teal:#12BCBC; --card:#FFFFFF;
  --ban-bg:#68121F; --cream:#FFFDE8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--paper);color:var(--ink);font-family:'Roboto',system-ui,sans-serif;font-size:15px;line-height:1.55}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 48px}
.display{font-family:'Staatliches',sans-serif;letter-spacing:.03em;text-transform:uppercase;font-weight:400}
.mono{font-family:'Bebas Neue',sans-serif;letter-spacing:.04em}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.tape{height:12px;background:repeating-linear-gradient(90deg,var(--red) 0 6px,var(--ink) 6px 24px)}
.login{min-height:100vh;display:flex;flex-direction:column}
.login-body{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:420px;width:100%;margin:0 auto;padding:32px 24px}
.brand{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:.12em;color:var(--red)}
.login h1{font-size:52px;line-height:.98;margin:10px 0 8px;color:var(--ink)}
.login .sub{color:var(--steel);margin-bottom:28px}
.code-input{width:100%;padding:16px;font-family:'IBM Plex Mono',monospace;font-size:20px;letter-spacing:.18em;text-transform:uppercase;border:2px solid var(--ink);background:var(--card);border-radius:6px;color:var(--ink)}
.enter-btn{width:100%;margin-top:12px;padding:16px;background:var(--red);color:#fff;border-radius:6px;font-family:'Staatliches',sans-serif;letter-spacing:.1em;text-transform:uppercase;font-size:18px}
.enter-btn:active{transform:translateY(1px);background:var(--sauce)}
.code-input.is-email{font-family:'Roboto',system-ui,sans-serif;font-size:18px;letter-spacing:0;text-transform:none}
.link-btn{display:block;margin:14px auto 0;color:var(--red);font-weight:700;text-decoration:underline;font-size:14px}
.enter-btn:disabled{opacity:.6}
.mt{margin-top:10px}
.form{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.form label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
.form input[type=text],.form input[type=email],.form input[type=password],.form select{font:inherit;font-weight:400;font-size:16px;padding:12px;border:2px solid var(--ink);border-radius:6px;background:var(--card);color:var(--ink);width:100%}
.form .chk{flex-direction:row;align-items:center;font-weight:400}
.form .chk input{width:20px;height:20px}
.okmsg{margin:10px 0;padding:10px 12px;background:#E3F7F7;border-left:4px solid var(--teal);border-radius:4px;font-size:14px}
.small{font-size:12.5px;color:var(--steel)}
.sbtn{display:inline-block;padding:11px 14px;border:2px solid var(--ink);border-radius:6px;font-weight:700;font-size:14px;background:var(--card);color:var(--ink);text-decoration:none;text-align:center}
.sbtn.wide{width:100%}
.sbtn.danger{border-color:var(--red);color:var(--red)}
.sbtn:disabled{opacity:.6}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .sbtn{flex:1}
.linkbox{margin-top:12px;padding:14px;border:2px dashed var(--red);border-radius:8px;background:var(--card);display:flex;flex-direction:column;gap:10px}
.lb-h{font-family:'Staatliches',sans-serif;letter-spacing:.05em;text-transform:uppercase;font-size:17px}
.lb-url{font-family:'IBM Plex Mono',monospace;font-size:12px;word-break:break-all;background:#F3EFD8;padding:8px;border-radius:4px;user-select:all}
.st{font-weight:700;font-size:12px}
.st.on{color:#0B8585}
.st.pend{color:var(--red)}
.ugroup{font-family:'Bebas Neue',sans-serif;letter-spacing:.08em;color:var(--red);font-size:15px;margin:16px 0 6px}
.det summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--red);margin:4px 0}
.det[open]{display:flex;flex-direction:column;gap:10px}
.me{margin-top:26px;font-size:13px;color:var(--steel)}
.link-inline{color:var(--red);font-weight:700;text-decoration:underline;font-size:13px}
.err{margin-top:10px;color:var(--red);font-weight:700}
.hint{margin-top:26px;padding:14px;border:1px dashed var(--line);border-radius:6px;font-size:13px;color:var(--steel)}
.hint code{font-family:'IBM Plex Mono',monospace;color:var(--ink);background:#F3EFD8;padding:1px 5px;border-radius:3px}
.hdr{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:2px solid var(--ink)}
.hdr-in{max-width:640px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.hdr .t{font-size:22px}
.hdr .t .star{color:var(--red)}
.sp{flex:1}
.chip{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:.08em;background:var(--red);color:#fff;padding:5px 12px;border-radius:99px;white-space:nowrap}
.out{font-size:13px;color:var(--steel);text-decoration:underline}
.back{font-weight:700;font-size:14px;padding:8px 0;color:var(--red)}
.qb{margin:20px 0 8px;background:var(--ink);border-radius:10px;overflow:hidden;border-bottom:6px solid var(--red)}
.qb-h{padding:12px 16px 8px;color:var(--cream);font-size:18px}
.qb-h .star{color:var(--red)}
.qb-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#2A2723;padding:1px}
.qb-cell{background:var(--ink);padding:12px 14px;color:var(--cream)}
.qb-v{color:var(--cream);font-size:23px;font-family:'Bebas Neue',sans-serif}
.qb-k{color:#A9A398;font-size:11.5px;line-height:1.35;margin-top:2px}
.sec{margin-top:28px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.sec-h .t{font-size:25px;color:var(--ink)}
.draft-tag{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--red);border:1.5px solid var(--red);padding:2px 7px;border-radius:4px;text-transform:uppercase}
.card{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:8px;padding:15px 16px;margin-bottom:10px;display:flex;gap:14px;align-items:center}
.card:active{background:#FBF8E4}
.card .n{font-family:'Bebas Neue',sans-serif;color:var(--steel);font-size:15px;min-width:26px}
.card .tt{font-weight:700;font-size:16px}
.card .ss{color:var(--steel);font-size:13px;margin-top:2px}
.card .ar{margin-left:auto;color:var(--red);font-size:18px}
.d-title{font-size:38px;line-height:1;margin:18px 0 4px}
.d-sum{color:var(--steel);margin-bottom:20px}
.blk-p{margin:12px 0}
.blk-h{font-family:'Bebas Neue',sans-serif;letter-spacing:.09em;font-size:16px;color:var(--red);margin:22px 0 8px}
.blk-warn{margin:14px 0;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.blk-warn .bar{height:8px;background:repeating-linear-gradient(90deg,var(--red) 0 5px,var(--ink) 5px 20px)}
.blk-warn .tx{padding:12px 14px;font-weight:700}
.blk-ban{margin:14px 0;background:var(--sauce);border-left:5px solid var(--red);border-radius:0 8px 8px 0;padding:12px 14px;font-weight:700;color:var(--cream)}
ol.blk-steps{margin:12px 0;counter-reset:st}
ol.blk-steps li{list-style:none;display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
ol.blk-steps li:last-child{border-bottom:none}
ol.blk-steps li::before{counter-increment:st;content:counter(st,decimal-leading-zero);font-family:'Bebas Neue',sans-serif;color:var(--red);font-size:16px;padding-top:1px}
ul.blk-list{margin:12px 0;padding-left:0}
ul.blk-list li{list-style:none;padding:6px 0 6px 22px;position:relative}
ul.blk-list li::before{content:"★";position:absolute;left:0;top:6px;color:var(--red);font-size:12px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.split .col{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--ink);border-radius:8px;padding:12px}
.split .ch{font-family:'Bebas Neue',sans-serif;letter-spacing:.06em;font-size:15px;margin-bottom:8px;color:var(--red)}
.split li{list-style:none;font-size:14px;padding:3px 0;color:#3B372F}
.media{margin:16px 0;border:2px dashed var(--steel);border-radius:8px;padding:22px 16px;text-align:center;color:var(--steel);background:rgba(255,255,255,.5)}
.media .mk{font-family:'Bebas Neue',sans-serif;letter-spacing:.1em;font-size:14px;color:var(--red)}
.media .ml{font-size:14px;margin-top:4px}
.media-img{margin:16px 0;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#fff}
.media-img img{display:block;width:100%;height:auto}
.media-img .cap{padding:8px 12px;font-size:12.5px;color:var(--steel);border-top:1px solid var(--line)}
.grid-err{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:13px 14px}
.gcard .e{font-weight:700}
.gcard .c{color:var(--red);font-size:13.5px;margin:3px 0}
.gcard .s{font-size:14px}
.gcard .s b{color:var(--teal)}
.ck{margin:18px 0;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ck-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--ink);color:var(--cream)}
.ck-h .t{font-family:'Bebas Neue',sans-serif;letter-spacing:.08em;font-size:16px;color:var(--cream)}
.ck-h .pr{font-family:'Bebas Neue',sans-serif;font-size:15px;color:#A9A398}
.ck-h .pr.done{color:var(--teal);font-weight:400}
.ck-item{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}
.ck-item:last-child{border-bottom:none}
.ck-box{width:22px;height:22px;min-width:22px;border:2px solid var(--ink);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;background:var(--card)}
.ck-item.on .ck-box{background:var(--teal);border-color:var(--teal);color:#fff}
.ck-item.on .lx{color:var(--steel);text-decoration:line-through}
.note{margin:26px 0 0;padding:12px 14px;border:1px dashed var(--line);border-radius:8px;font-size:13px;color:var(--steel)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script src="/app.js" defer></script>
</body>
</html>
